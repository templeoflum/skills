<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>◐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0e0d12}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#scene{width:min(80vw,340px);height:auto}
#rail{width:min(86vw,420px);height:auto;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <!-- THE SCENE: replace with the toy's world. Wordless. -->
  <svg id="scene" viewBox="0 0 300 300" aria-label="the study">
    <circle id="thing" cx="150" cy="150" r="40" fill="none" stroke="#e9e3d4" stroke-width="2"/>
  </svg>
  <!-- THE KNOB: the standard rail. No ticks, no labels. -->
  <svg id="rail" viewBox="0 0 420 56" aria-label="the knob">
    <line x1="30" y1="28" x2="390" y2="28" stroke="#26242f" stroke-width="2" stroke-linecap="round"/>
    <circle id="knob" cx="30" cy="28" r="13" fill="#0e0d12" stroke="#93a4c2" stroke-width="2"/>
    <circle id="knobcore" cx="30" cy="28" r="4" fill="#93a4c2"/>
  </svg>
</div>
<script>
/* ── AU tone engine: two sustained voices + filter + blip. Silent until armed.
   Sound must voice the toy's OWN invariant — entailed, never decorative.
   Delete if the toy is deliberately silent (note why in the notebook). ── */
const AU=(function(){
  let AC=null,master,lp,vA,vB,gA,gB;
  function ensure(){ if(AC)return;
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.11;
    lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1300;
    lp.connect(master); master.connect(AC.destination);
    [0,1].forEach(i=>{const o=AC.createOscillator();o.type="triangle";o.frequency.value=180;
      const g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(lp);o.start();
      if(i===0){vA=o;gA=g}else{vB=o;gB=g}});
  }
  /* robust unlock: some webviews only release audio on touchend/click,
     some need a silent buffer played inside the gesture */
  var kicked=false;
  ["pointerdown","touchend","mousedown","click","keydown"].forEach(function(ev){
    document.addEventListener(ev,function(){
      ensure();
      if(AC.state!=="running"){ try{ AC.resume(); }catch(e){} }
      if(!kicked){ kicked=true;
        try{ var b=AC.createBuffer(1,1,22050), s=AC.createBufferSource();
             s.buffer=b; s.connect(AC.destination); s.start(0); }catch(e){}
      }
    },{passive:true});
  });
  return {
    on:function(v,f,g,tc){ if(!AC)return; const o=v?vB:vA, gg=v?gB:gA;
      o.frequency.setTargetAtTime(f,AC.currentTime,tc===undefined?.05:tc);
      gg.gain.setTargetAtTime(g===undefined?.3:g,AC.currentTime,.12); },
    off:function(v,t){ if(!AC)return; (v?gB:gA).gain.setTargetAtTime(0,AC.currentTime,t||.15); },
    lpf:function(f){ if(!AC)return; lp.frequency.setTargetAtTime(f,AC.currentTime,.25); },
    blip:function(f,g,d){ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator();
      o.type="triangle";o.frequency.value=f;
      const gg=AC.createGain();gg.gain.setValueAtTime(0,t);
      gg.gain.linearRampToValueAtTime(g||.06,t+.012);
      gg.gain.exponentialRampToValueAtTime(.0001,t+(d||.4));
      o.connect(gg);gg.connect(lp);o.start(t);o.stop(t+(d||.4)+.1); }
  };
})();

/* ── THE TOY ──
   One knob (normalized k, 0..1), one invariant.
   RULES: entailed behavior only; knob changes never corrupt a running cycle
   (apply at boundary or use a generation token); CSS transitions do NOT work
   on SVG attribute transform — use style.transform with transform-box:fill-box. */
const thing=document.getElementById("thing");
let k=0;
function apply(){
  /* replace: drive the world from k */
  thing.setAttribute("r", 20+k*80);
  AU.on(0, 150+k*300, .25, .1);
}
apply();

/* ── the standard slider (leave as-is) ── */
const rail=document.getElementById("rail");
const knob=document.getElementById("knob");
const knobcore=document.getElementById("knobcore");
let dragging=false;
function set(clientX){
  const r=rail.getBoundingClientRect();
  k=Math.min(1,Math.max(0,(clientX-r.left-r.width*30/420)/(r.width*360/420)));
  apply();
  const x=30+360*k;
  knob.setAttribute("cx",x); knobcore.setAttribute("cx",x);
}
function start(e){dragging=true;move(e);}
function move(e){
  if(!dragging)return;
  set(e.touches?e.touches[0].clientX:e.clientX);
  if(e.cancelable)e.preventDefault();
}
rail.addEventListener("mousedown",start);
rail.addEventListener("touchstart",start,{passive:false});
window.addEventListener("mousemove",move);
window.addEventListener("touchmove",move,{passive:false});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{if(dragging)e.preventDefault();},{passive:false});

/* ── atom interface: every toy speaks one protocol (leave as-is; set NAME) ── */
(function(){
  const rail=document.getElementById("rail");
  function n2c(t){const r=rail.getBoundingClientRect();return r.left+r.width*(30+360*Math.min(1,Math.max(0,t)))/420;}
  window.atom={name:"TOY-NAME",
    set:function(t){set(n2c(t));},
    get:function(){const x=parseFloat(document.getElementById("knob").getAttribute("cx"));return (x-30)/360;}};
  const q=new URLSearchParams(location.search).get("k");
  if(q!==null) setTimeout(function(){window.atom.set(parseFloat(q));},80);
  window.addEventListener("message",function(e){if(e.data&&typeof e.data.atomSet==="number")window.atom.set(e.data.atomSet);});
  let lx=null;
  setInterval(function(){
    const x=parseFloat(document.getElementById("knob").getAttribute("cx"));
    if(x!==lx){lx=x;try{if(parent!==window)parent.postMessage({atomChange:{name:window.atom.name,k:(x-30)/360}},"*");}catch(err){}}
  },150);
})();
</script>
</body>
</html>
